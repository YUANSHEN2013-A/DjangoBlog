version: '3'

services:
  db:
    image: mysql:latest
    restart: always
    environment:
      - MYSQL_DATABASE=djangoblog
      - MYSQL_ROOT_PASSWORD=QQQQwww123!@#
    ports:
      - 3306:3306
    volumes:
      - mysql_data:/var/lib/mysql
    depends_on:
      - redis
    container_name: db

  redis:
    restart: always
    image: redis:latest
    container_name: redis
    ports:
      - 6379:6379

  es:
    image: liangliangyy/elasticsearch-analysis-ik:8.6.1
    container_name: es
    restart: always
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - 9200:9200
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./es-init.sh:/usr/share/elasticsearch/es-init.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  es-init:
    image: curlimages/curl:latest
    container_name: es-init
    depends_on:
      es:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./es-init.sh:/es-init.sh
    entrypoint: ["sh", "/es-init.sh"]

  kibana:
    image: kibana:8.6.1
    restart: always
    container_name: kibana
    ports:
      - 5601:5601
    environment:
      - ELASTICSEARCH_HOSTS=http://es:9200
    depends_on:
      es:
        condition: service_healthy

  djangoblog:
    build:
      context: ../../
      dockerfile: Dockerfile
    restart: always
    command: bash -c 'sh /code/djangoblog/deploy/entrypoint.sh'
    ports:
      - "8000:8000"
    volumes:
      - static_files:/code/djangoblog/collectedstatic
      - ./logs:/code/djangoblog/logs
      - ./uploads:/code/djangoblog/uploads
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_MYSQL_DATABASE=djangoblog
      - DJANGO_MYSQL_USER=root
      - DJANGO_MYSQL_PASSWORD=QQQQwww123!@#
      - DJANGO_MYSQL_HOST=db
      - DJANGO_MYSQL_PORT=3306
      - DJANGO_REDIS_URL=redis:6379
      - DJANGO_ELASTICSEARCH_HOST=es:9200
    depends_on:
      db:
        condition: service_started
      es:
        condition: service_healthy
    container_name: djangoblog

  nginx:
    restart: always
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx-es.conf:/etc/nginx/nginx.conf
      - static_files:/code/djangoblog/collectedstatic:ro
      - ../.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - djangoblog
      - kibana
    container_name: nginx

volumes:
  mysql_data:
  static_files:
  es_data:
