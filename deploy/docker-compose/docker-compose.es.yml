version: '3'

services:
  db:
    image: mysql:latest
    restart: always
    environment:
      - MYSQL_DATABASE=djangoblog
      - MYSQL_ROOT_PASSWORD=QQQQwww123!@#
    ports:
      - 3306:3306
    volumes:
      - mysql_data:/var/lib/mysql
    depends_on:
      - redis
    container_name: db

  redis:
    restart: always
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

  es:
    image: liangliangyy/elasticsearch-analysis-ik:8.6.1
    container_name: es
    restart: always
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - 9200:9200
    volumes:
      - es_data:/usr/share/elasticsearch/data/

  kibana:
    image: kibana:8.6.1
    restart: always
    container_name: kibana
    ports:
      - 5601:5601
    environment:
      - ELASTICSEARCH_HOSTS=http://es:9200
      - server.basePath=/kibana
      - server.rewriteBasePath=true
    depends_on:
      - es

  djangoblog:
    build:
      context: ../../
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - static_files:/code/djangoblog/collectedstatic
      - ./logs:/code/djangoblog/logs
      - ./uploads:/code/djangoblog/uploads
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_MYSQL_DATABASE=djangoblog
      - DJANGO_MYSQL_USER=root
      - DJANGO_MYSQL_PASSWORD=QQQQwww123!@#
      - DJANGO_MYSQL_HOST=db
      - DJANGO_MYSQL_PORT=3306
      - DJANGO_REDIS_URL=redis:6379
      - DJANGO_ELASTICSEARCH_HOST=es:9200
    links:
      - db
      - redis
      - es
    depends_on:
      - db
      - es
    container_name: djangoblog

  nginx:
    restart: always
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx.conf:/etc/nginx/nginx.conf
      - static_files:/code/djangoblog/collectedstatic:ro
      - ../nginx_htpasswd:/etc/nginx/.htpasswd:ro
    links:
      - djangoblog:djangoblog
      - kibana:kibana
    container_name: nginx

volumes:
  mysql_data:
  static_files:
  es_data:
