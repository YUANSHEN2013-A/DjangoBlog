version: '3.8'

services:
  db:
    image: mysql:latest
    restart: always
    environment:
      - MYSQL_DATABASE=djangoblog
      - MYSQL_ROOT_PASSWORD=QQQQwww123!@#
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    container_name: db

  redis:
    restart: always
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

  djangoblog:
    build:
      context: ../../
      dockerfile: Dockerfile
    restart: always
    entrypoint:
      - /code/djangoblog/deploy/entrypoint.sh
    ports:
      - "8000:8000"
    volumes:
      - static_files:/code/djangoblog/collectedstatic
      - ./logs:/code/djangoblog/logs
      - ./uploads:/code/djangoblog/uploads
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_MYSQL_DATABASE=djangoblog
      - DJANGO_MYSQL_USER=root
      - DJANGO_MYSQL_PASSWORD=QQQQwww123!@#
      - DJANGO_MYSQL_HOST=db
      - DJANGO_MYSQL_PORT=3306
      - DJANGO_REDIS_URL=redis:6379/0
    depends_on:
      - db
      - redis
    container_name: djangoblog

  nginx:
    restart: always
    image: nginx:latest
    command: >
      /bin/sh -c 'printf "%s\n" "$${KIBANA_BASIC_AUTH_HTPASSWD:-}" > /etc/nginx/kibana.htpasswd
      && exec nginx -g "daemon off;"'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx.conf:/etc/nginx/nginx.conf
      - static_files:/code/djangoblog/collectedstatic:ro
    depends_on:
      - djangoblog
    container_name: nginx

volumes:
  mysql_data:
  static_files:
